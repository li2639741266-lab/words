const QD = () => S.mode==='rev' ? RPD(cur) : PD(cur);
function pickRow(w){
  const m=S.marks[w], rev=S.mode==='rev', r=P(cur)[w];
  const tag = rev ? (r?`<span class="tag" style="--c:var(--b${r.b})">${BOXNAME[r.b]}</span>`:'')
                  : (FG(cur).includes(w) ? '<span class="tag" style="--c:var(--no)">遗忘</span>' : '');
  return `<div class="w${rev?' txt':''}${m?' is-'+m:''}" data-w="${esc(w)}"><button class="say" aria-label="朗读 ${esc(w)}">${esc(w)}${tag}</button>
    <button class="mark yes" aria-label="${rev?'记得':'认识'}" aria-pressed="${m==='yes'}">${ICON_YES}<span class="lbl">${rev?'记得':'会'}</span></button><button class="mark no" aria-label="${rev?'遗忘':'不认识'}" aria-pressed="${m==='no'}">${ICON_NO}<span class="lbl">${rev?'遗忘':'不会'}</span></button></div>`;
}
function tallyHTML(){
  if(S.mode==='rev'){ const y=Object.values(S.marks).filter(x=>x==='yes').length; return `遗忘 <b>${RPD(cur).length}</b> 个 · 记得 ${y} 个`; }
  const n=PD(cur).length;
  return `已选 <b>${n}</b><span class="cap"> / ${CAP}</span> 个不认识${n>=CAP?' <span class="full">已选满</span>':''}`;
}
function renderPick(){
  const rev=S.mode==='rev', n=QD().length, total=S.list.length, done=Object.keys(S.marks).length;
  const list = total
    ? `<div class="words" id="words">${S.list.slice(0,S.shown).map(pickRow).join('')}</div><div class="more" id="more">${S.shown<total?'继续往下滑，加载更多':'没有更多了'}</div>`
    : `<div class="done"><h3>${rev?'今天没有到期要复习的单词':'这个词库没有新词了'}</h3><p>${n?`已标记的 ${n} 个词，点右下角「开始学习」。`:''}</p><button class="btn" id="toLib">回到词库</button></div>`;
  app.innerHTML = `
  <div class="study-head">
    <header class="top"><button class="back" id="sBack">${rev?'‹ 退出复习':'‹ 退出学习'}</button><h2>${rev?'复习':'选词'}</h2><span class="sub num" id="seen" style="min-width:56px;text-align:right">${done}/${total}</span></header>
    <div class="prog"><i style="width:${total?done/total*100:100}%"></i></div>
  </div>
  ${simNote()}
  ${rev?'<p class="intro">记得点「记得」，单词进入下一个词盒；忘了点「遗忘」，稍后分组重新学习。</p>':''}
  ${list}
  <div class="bottom"><span class="tally">${tallyHTML()}</span><button class="btn primary" id="startLearn" ${n?'':'disabled'}>开始学习</button></div>`;
  document.getElementById('sBack').onclick=()=>{ const k=QD().length; if(k) toast(rev?`遗忘的 ${k} 个词会保留，下次接着学`:`已选的 ${k} 个词会保留`); openLib(cur); };
  document.getElementById('startLearn').onclick=()=>startLearning(rev?'rev':'learn');
  const tl=document.getElementById('toLib'); if(tl) tl.onclick=()=>openLib(cur);
  FX.popIn(app.querySelectorAll('#words .w'));
}
function updatePick(){
  const total=S.list.length, done=Object.keys(S.marks).length;
  app.querySelector('.prog i').style.width=(total?done/total*100:100)+'%';
  document.getElementById('seen').textContent=`${done}/${total}`;
  app.querySelector('.tally').innerHTML=tallyHTML();
  document.getElementById('startLearn').disabled=!QD().length;
}
function pick(row, w, ok){
  const p=P(cur), lg=L(cur), t=today(), was=S.marks[w], want=ok?'yes':'no', rev=S.mode==='rev', hi=HI(cur);
  speak(w);
  if(!rev && was!==want && !ok && PD(cur).length>=CAP){ toast(`本次最多选 ${CAP} 个，先点「开始学习」`); return; }
  // undo the previous mark on this word
  if(was==='yes'){
    if(rev){ p[w]=S.prev[w]; lg.rev--; lg.revOk--; }
    else { delete p[w]; lg.known=lg.known.filter(x=>x!==w); }
    if(w in S.prevHist){ S.prevHist[w]===undefined ? delete hi[w] : hi[w]=S.prevHist[w]; }
  }
  if(was==='no'){
    if(rev){ rpend[cur.id]=RPD(cur).filter(x=>x!==w); lg.rev--; if(w in S.prevHist){ S.prevHist[w]===undefined ? delete hi[w] : hi[w]=S.prevHist[w]; } }
    else pend[cur.id]=PD(cur).filter(x=>x!==w);
  }
  if(was===want){ delete S.marks[w]; }
  else {
    if(rev){
      if(ok){ S.prev[w]={...p[w]}; promote(cur,w); lg.rev++; lg.revOk++; }
      else { S.prevHist[w]=hi[w]; hi[w]='lapsed'; RPD(cur).push(w); lg.rev++; }
    } else {
      if(ok){ S.prevHist[w]=hi[w]; if(hi[w]!=='lapsed') hi[w]='pre'; p[w]={b:5,due:null,t,cat:hi[w]==='lapsed'?'review':'pre'}; lg.known.push(w); }
      else { PD(cur).push(w); if(PD(cur).length===CAP) toast(`已选满 ${CAP} 个，点「开始学习」`); }
    }
    S.marks[w]=want;
  }
  save();
  const m=S.marks[w];
  row.className='w'+(rev?' txt':'')+(m?' is-'+m:'');
  row.querySelector('.mark.yes').setAttribute('aria-pressed', m==='yes');
  row.querySelector('.mark.no').setAttribute('aria-pressed', m==='no');
  updatePick();
  const btn=row.querySelector(ok?'.mark.yes':'.mark.no'); FX.jelly(btn);
  if(m==='yes') FX.good(btn,{praise:false}); else if(m==='no') FX.soft(btn); else FX.tap();
}
window.addEventListener('scroll',()=>{
  if(!S || (S.mode!=='learn' && S.mode!=='rev') || S.shown>=S.list.length) return;
  if(window.innerHeight+window.scrollY < document.documentElement.scrollHeight-600) return;
  const list=document.getElementById('words'); if(!list) return;
  list.insertAdjacentHTML('beforeend', S.list.slice(S.shown,S.shown+PAGE).map(pickRow).join(''));
  S.shown+=PAGE;
  document.getElementById('more').textContent = S.shown<S.list.length?'继续往下滑，加载更多':'没有更多了';
},{passive:true});
function rowHTML(w){
  const r=P(cur)[w];
  const tag = S.mode==='review' && r ? `<span class="tag" style="--c:var(--b${r.b})">${r.b}</span>` : '';
  return `<div class="w" data-w="${esc(w)}"><button class="say" aria-label="朗读 ${esc(w)}">${esc(w)}${tag}</button>
    <button class="mark yes" aria-label="认识">${ICON_YES}<span class="lbl">会</span></button><button class="mark no" aria-label="不认识">${ICON_NO}<span class="lbl">不会</span></button></div>`;
}
function tallyHTML_old(){
  if(S.mode==='review') return `认识 <b>${S.yes}</b> · 不认识 <b>${S.no}</b>`;
  const n=PD(cur).length;
  return `已选 <b>${n}</b><span class="cap"> / ${CAP}</span> 个不认识${n>=CAP?' <span class="full">已选满</span>':''}`;
}
function renderStudy(){
  const isRev=S.mode==='review';
  const left=S.queue.length, n=PD(cur).length;
  let body;
  if(!left){
    if(isRev){
      body=`<div class="done"><div class="celebrate-row">${mascotSVG()}</div>${STARS}<h3>复习完成！</h3><p>认识 ${S.yes} 个，已升入下一个词盒；不认识 ${S.no} 个，回到「初出茅庐」，明天再复习。</p>
        ${freshList(cur).length||n?'<button class="btn primary" id="toLearn">开始学新词</button>':''}<button class="btn" id="toLib">回到词库</button></div>`;
    } else {
      body=`<div class="done"><h3>新词都看完了</h3><p>${n?`本次选了 ${n} 个不认识的词，点右下角「开始学习」。`:'这个词库没有新词了。'}</p><button class="btn" id="toLib">回到词库</button></div>`;
    }
  } else {
    body=`<div class="words" id="words">${S.queue.slice(0,VISIBLE).map(rowHTML).join('')}</div>`;
  }
  const pct = S.total ? (S.done/S.total*100) : 100;
  const right = isRev ? `<span class="sub num" style="min-width:56px;text-align:right">${S.done}/${S.total}</span>`
                      : `<button class="act" id="undo" ${S.undo.length?'':'disabled'}>撤销</button>`;
  const bottom = isRev
    ? (left||S.undo.length?`<div class="bottom"><span class="tally">${tallyHTML_old()}</span><button class="btn sm" id="undoR" ${S.undo.length?'':'disabled'}>撤销</button></div>`:'')
    : `<div class="bottom"><span class="tally">${tallyHTML()}</span><button class="btn primary" id="startLearn" ${n?'':'disabled'}>开始学习</button></div>`;
  app.innerHTML = `
  <div class="study-head">
    <header class="top"><button class="back" id="sBack">${isRev?'‹ 退出复习':'‹ 退出学习'}</button><h2>${isRev?'复习':'选词'}</h2>${right}</header>
    <div class="prog"><i style="width:${pct}%"></i></div>
  </div>
  ${simNote()}
  ${body}
  ${bottom}`;
  document.getElementById('sBack').onclick=()=>{ if(!isRev && n) toast(`已选的 ${n} 个词会保留`); openLib(cur); };
  const tl=document.getElementById('toLib'); if(tl) tl.onclick=()=>openLib(cur);
  const tn=document.getElementById('toLearn'); if(tn) tn.onclick=()=>{ PD(cur).length && !freshList(cur).length ? startLearning() : startStudy('learn'); };
  const un=document.getElementById('undo')||document.getElementById('undoR'); if(un) un.onclick=undo;
  const sl=document.getElementById('startLearn'); if(sl) sl.onclick=startLearning;
  if(left) FX.popIn(app.querySelectorAll('#words .w'));
  if(!left && isRev && !S.cele){ S.cele=1; FX.levelClear({voiceText:'Great job'}); }
}
app.addEventListener('click',e=>{
  if(!S) return;
  const row=e.target.closest('.w'); if(!row) return;
  const w=row.dataset.w;
  if(e.target.closest('.say')){ speak(w, row.querySelector('.say')); return; }
  const yes=e.target.closest('.mark.yes'), no=e.target.closest('.mark.no');
  if(!yes && !no) return;
  if(S.mode==='learn' || S.mode==='rev'){ pick(row, w, !!yes); return; }
  if(row.dataset.busy) return;
  if(no && S.mode==='learn' && PD(cur).length>=CAP){ toast(`本次最多选 ${CAP} 个，先点「开始学习」`); return; }
  row.dataset.busy='1';
  speak(w);
  mark(w, !!yes);
  { const mb=yes||no; FX.jelly(mb); yes?FX.good(mb,{praise:false}):FX.soft(mb); }
  row.classList.add(yes?'out-yes':'out-no');
  if(no && S.mode==='learn' && PD(cur).length===CAP) setTimeout(()=>toast(`已选满 ${CAP} 个，点「开始学习」`),200);
  setTimeout(()=>refreshAfterMark(), window.matchMedia('(prefers-reduced-motion: reduce)').matches?0:180);
});
function mark(w, ok){
  const p=P(cur), lg=L(cur), t=today();
  const prev = p[w] ? {...p[w]} : null;
  const prevLog = {learn:[...lg.learn], known:[...lg.known], rev:lg.rev, revOk:lg.revOk};
  if(S.mode==='learn'){
    if(ok){ p[w]={b:5,due:null,t}; lg.known.push(w); }
    else { PD(cur).push(w); }
  } else {
    lg.rev++;
    if(ok){ const nb=p[w].b+1; p[w]={b:nb, due: nb>=5?null:t+INTERVAL[nb], t:p[w].t}; lg.revOk++; }
    else { p[w]={b:1, due:t+INTERVAL[1], t:p[w].t}; }
  }
  ok?S.yes++:S.no++; S.done++;
  S.queue=S.queue.filter(x=>x!==w);
  S.undo.push({w,prev,prevLog,ok});
  save();
}
function refreshAfterMark(){
  if(!S) return;
  const list=document.getElementById('words');
  if(!S.queue.length || !list){ renderStudy(); return; }
  list.querySelectorAll('.w.out-yes,.w.out-no').forEach(r=>r.remove());
  const shown=new Set([...list.querySelectorAll('.w')].map(r=>r.dataset.w));
  S.queue.slice(0,VISIBLE).forEach(w=>{ if(!shown.has(w)) list.insertAdjacentHTML('beforeend',rowHTML(w)); });
  updateBars();
}
function updateBars(){
  app.querySelector('.prog i').style.width=(S.total?S.done/S.total*100:100)+'%';
  if(S.mode==='review') app.querySelector('.study-head .sub').textContent=`${S.done}/${S.total}`;
  const tally=app.querySelector('.tally'); if(tally) tally.innerHTML=tallyHTML();
  const un=document.getElementById('undo')||document.getElementById('undoR'); if(un) un.disabled=!S.undo.length;
  const sl=document.getElementById('startLearn'); if(sl) sl.disabled=!PD(cur).length;
}
function undo(){
  const u=S.undo.pop(); if(!u) return;
  const p=P(cur);
  if(u.prev) p[u.w]=u.prev; else delete p[u.w];
  if(S.mode==='learn' && !u.ok){ const pd=PD(cur); const i=pd.lastIndexOf(u.w); if(i>=0) pd.splice(i,1); }
  const t=today(); log[cur.id][t]=u.prevLog;
  u.ok?S.yes--:S.no--; S.done--;
  S.queue.unshift(u.w);
  save(); renderStudy();
  toast(`已撤销：${u.w}`);
}

/* ---------- learning: 5 words per page, in the order chosen ---------- */
let G=null;
function startLearning(kind){
  kind = kind==='rev' ? 'rev' : 'learn';
  const words=[...(kind==='rev'?RPD(cur):PD(cur))]; if(!words.length) return;
  S=null; G={kind, words, page:0, pages:Math.ceil(words.length/PER), clicks:{}, view:'list', cut:new Set(), show:new Set()};
  renderLearning();
}
const ICON_CUT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.1 15.9M14.5 14.5L20 20M8.1 8.1L12 12"/></svg>';
function groupSelect(){
  return `<label class="grp-sel"><select id="grp" aria-label="选择第几组">${Array.from({length:G.pages},(_,i)=>`<option value="${i}" ${i===G.page?'selected':''}>第 ${i+1}/${G.pages} 组</option>`).join('')}</select></label>`;
}
function bindCommon(){
  const ex=document.getElementById('lExit'); if(ex) ex.onclick=()=>{ const rv=G.kind==='rev'; G=null; toast(rv?'遗忘的词已保留，下次可继续复习':'本次选的词已保留，下次可继续学习'); openLib(cur); };
  const fin=document.getElementById('fin');
  if(fin) fin.onclick=()=>{
    if(G.page===G.pages-1 || fin.classList.contains('arm')) return startFinal();
    fin.classList.add('arm'); fin.textContent='再点确认';
    toast(`还有 ${G.pages-G.page-1} 组没看，确定现在完成？`);
    setTimeout(()=>{ if(fin.isConnected){ fin.classList.remove('arm'); fin.textContent='完成学习'; } },3000);
  };
}
function renderLearning(){
  if(G.view==='cut') return renderCut();
  if(G.view==='final') return renderFinal();
  const {words,page,pages}=G;
  G.maxPage=Math.max(G.maxPage||0,page);
  const slice=words.slice(page*PER, page*PER+PER);
  const cards = slice.map((w,i)=>`<button class="card" data-w="${esc(w)}" style="--c:var(--b${i+1})"><span class="i">${page*PER+i+1}</span><span class="t">${esc(w)}</span><span class="m"${G.lshow===w?'':' hidden'}>${esc((cur.defs||{})[w]||'暂无释义')}</span></button>`).join('')
    + Array.from({length:PER-slice.length},()=>'<div class="card blank" aria-hidden="true"></div>').join('');
  app.innerHTML = `<section class="learn"><div class="learn-in">
    <header class="top"><button class="back" id="lExit">${G.kind==='rev'?'‹ 退出复习':'‹ 退出学习'}</button><h2>${G.kind==='rev'?'复习':'学习'}</h2><button class="act" id="fin">完成学习</button></header>
    ${simNote()}
    <div class="cards" id="cards">${cards}</div>
    <div class="foot">
      <button class="btn l" id="prev" ${page?'':'disabled'}>上一组</button>
      ${groupSelect()}
      <button class="btn r primary cutbtn" id="toCut">${ICON_CUT}<span>剪纸盒</span></button>
    </div></div></section>`;
  bindCommon();
  document.getElementById('prev').onclick=()=>{ if(G.page){G.page--; renderLearning();} };
  document.getElementById('grp').onchange=e=>{ G.page=+e.target.value; renderLearning(); };
  document.getElementById('toCut').onclick=()=>cutStart(groupWords(G.page));
  document.querySelectorAll('.card[data-w]').forEach(c=>c.onclick=()=>{
    // one tap: pronounce (and hide any other word's meaning); quick double tap: show / hide this word's meaning
    const w=c.dataset.w, now=Date.now(), lt=G.ltap||{};
    if(lt.w===w && now-lt.t<400){ G.lshow = G.lshow===w ? null : w; G.ltap={}; }
    else { speak(w,c); FX.jelly(c); if(G.lshow && G.lshow!==w) G.lshow=null; G.ltap={w,t:now}; }
    document.querySelectorAll('.card[data-w]').forEach(x=>{ x.querySelector('.m').hidden = x.dataset.w!==G.lshow; });
  });
  FX.popIn(app.querySelectorAll('.card[data-w]'));
  const box=document.getElementById('cards'); let x0=null,y0=null;
  box.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  box.addEventListener('touchend',e=>{ if(x0===null) return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){ if(dx<0 && G.page<G.pages-1){G.page++;renderLearning()} else if(dx>0 && G.page){G.page--;renderLearning()} } },{passive:true});
}

/* ---------- 剪纸盒: cut a word away once you know it; the rest move up ---------- */
const MIXVIS = 8;   // 混组检查: 8 words on screen at once
const groupWords = i => G.words.slice(i*PER, i*PER+PER);
const colorOf = w => G.words.indexOf(w)%PER+1;
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }
function cutStart(words, mix){
  G.view='cut'; G.mix=mix||null; G.cutAll=[...words]; G.cutQ=mix?shuffle(words):[...words];
  G.cshow=null; G.ctap={}; G.picking=false; G.enter=null; G.cele=0; G.popCut=1; renderLearning();
}
function cutCardHTML(w){
  return `<div class="card cutcard${G.enter===w?' enter':''}" data-w="${esc(w)}" style="--c:var(--b${colorOf(w)})">
    <button class="cc-main" aria-label="${esc(w)}，双击看释义"><span class="t">${esc(w)}</span><span class="m"${G.cshow===w?'':' hidden'}>${esc((cur.defs||{})[w]||'暂无释义')}</span></button>
    <button class="scissor" aria-label="剪掉 ${esc(w)}">${ICON_CUT}</button></div>`;
}
function renderCut(){
  const {page,pages}=G, last=page===pages-1, left=G.cutQ.length, maxP=G.maxPage||0;
  const nextBtn = last ? '<button class="btn primary" id="cdFin">完成学习</button>' : '<button class="btn primary" id="cdNext">学下一组</button>';
  let body;
  if(G.picking){
    const sel=G.mixSel, n=[...sel].reduce((a,i)=>a+groupWords(i).length,0);
    body=`<div class="cut-done mixpick"><h3>混组检查</h3><p>选几组单词混在一起，打乱顺序再剪一遍</p>
      <div class="chips">${Array.from({length:maxP+1},(_,i)=>`<button class="chip-g" data-g="${i}" aria-pressed="${sel.has(i)}" style="--c:var(--b${i%5+1})">第 ${i+1} 组</button>`).join('')}</div>
      <button class="btn sm" id="mxAll">${sel.size===maxP+1?'全不选':'全选'}</button>
      <div class="cut-actions"><button class="btn primary" id="mxGo" ${n?'':'disabled'}>开始混组（${n} 个词）</button><button class="btn" id="mxCancel">取消</button></div></div>`;
  } else if(!left){
    const head = G.mix ? `混组 ${G.cutAll.length} 个词全部剪完！` : `第 ${page+1} 组全部剪完！`;
    const sub = G.mix ? `第 ${G.mix.map(i=>i+1).join('、')} 组` : `${G.cutAll.length} 个单词都记住了`;
    const btns = G.mix
      ? `${nextBtn}<button class="btn" id="cdAgain">再剪一次（混组）</button>`
      : `${nextBtn}<button class="btn" id="cdAgain">再剪一次</button><button class="btn" id="cdMix">混组检查</button>`;
    body=`<div class="cut-done"><div class="celebrate-row">${mascotSVG()}</div>${STARS}
      <h3>${head}</h3><p>${sub}</p><div class="cut-actions">${btns}</div></div>`;
  } else {
    const tot=G.cutAll.length, done=tot-left;
    body=`<div class="boxbar"><span class="cube">${done}</span><div><b>${G.mix?'混组词盒':'单词词盒'}(${tot})</b><div class="pbar"><i style="width:${done/tot*100}%"></i></div></div><span class="cnt">${done}/${tot}</span></div><div class="cards" id="cards">${G.cutQ.slice(0,G.mix?MIXVIS:PER).map(cutCardHTML).join('')}</div>`;
  }
  const title = G.mix ? '混组检查' : '剪纸盒';
  app.innerHTML = `<section class="learn cutmode${G.mix?' mixmode':''}"><div class="learn-in">
    <p class="hint-s cut-hint">点一下听发音，双击看释义，记住了就点剪刀剪掉</p>
    <header class="top"><button class="back" id="cBack">‹ 返回学习</button><h2>${title}</h2><span class="sub" style="min-width:56px;text-align:right">${G.picking?'':`还剩 <b class="num">${left}</b>`}</span></header>
    ${body}
    <div class="foot"><button class="btn sm l mixbtn" id="toMix" ${G.picking?'disabled':''}>混组检查</button>${groupSelect()}<button class="act" id="fin" style="justify-self:end">完成学习</button></div>
  </div></section>`;
  G.enter=null;
  bindCommon();
  if(G.popCut && left && !G.picking){ G.popCut=0; FX.popIn(app.querySelectorAll('.cutcard')); }
  if(G.picking) FX.popIn(app.querySelectorAll('.chip-g'));
  if(!left && !G.picking && !G.cele){ G.cele=1; FX.levelClear({voiceText: G.mix?'Amazing':'Excellent'}); }
  document.getElementById('cBack').onclick=()=>{ G.view='list'; renderLearning(); };
  document.getElementById('grp').onchange=e=>{ G.page=+e.target.value; G.maxPage=Math.max(G.maxPage||0,G.page); cutStart(groupWords(G.page)); };
  const on=(id,f)=>{ const el=document.getElementById(id); if(el) el.onclick=f; };
  on('cdNext',()=>{ G.page++; G.view='list'; renderLearning(); });
  on('cdFin',startFinal);
  on('cdAgain',()=>cutStart(G.cutAll, G.mix));
  on('toMix',()=>{ G.picking=true; G.mixSel=new Set(Array.from({length:maxP+1},(_,i)=>i)); renderLearning(); });
  on('cdMix',()=>{ G.picking=true; G.mixSel=new Set(Array.from({length:maxP+1},(_,i)=>i)); renderLearning(); });
  on('mxAll',()=>{ G.mixSel = G.mixSel.size===maxP+1 ? new Set() : new Set(Array.from({length:maxP+1},(_,i)=>i)); renderLearning(); });
  on('mxCancel',()=>{ G.picking=false; renderLearning(); });
  on('mxGo',()=>{ const gs=[...G.mixSel].sort((a,b)=>a-b); cutStart(gs.flatMap(groupWords), gs); });
  document.querySelectorAll('.chip-g').forEach(b=>b.onclick=()=>{ const i=+b.dataset.g; G.mixSel.has(i)?G.mixSel.delete(i):G.mixSel.add(i); renderLearning(); });
  document.querySelectorAll('.cutcard').forEach(card=>{
    const w=card.dataset.w;
    card.querySelector('.cc-main').onclick=()=>{
      const now=Date.now(), lt=G.ctap||{};
      if(lt.w===w && now-lt.t<400){ G.cshow = G.cshow===w ? null : w; G.ctap={}; }
      else { speak(w, card); FX.jelly(card); if(G.cshow && G.cshow!==w) G.cshow=null; G.ctap={w,t:now}; }
      document.querySelectorAll('.cutcard').forEach(x=>{ x.querySelector('.m').hidden = x.dataset.w!==G.cshow; });
    };
    card.querySelector('.scissor').onclick=()=>{
      if(card.classList.contains('cutting')) return;
      card.classList.add('cutting');
      const allDone = G.cutQ.length===1;
      FX.cut(card.querySelector('.scissor'));
      const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      setTimeout(()=>{
        // remember where the other cards were, then let them slide up into place
        const before={}; document.querySelectorAll('.cutcard').forEach(c=>{ if(c!==card) before[c.dataset.w]=c.getBoundingClientRect().top; });
        G.cutQ=G.cutQ.filter(x=>x!==w); if(G.cshow===w) G.cshow=null;
        const incoming=G.cutQ[(G.mix?MIXVIS:PER)-1]; if(incoming && !(incoming in before)) G.enter=incoming;
        renderLearning();
        if(reduce) return;
        document.querySelectorAll('.cutcard').forEach(c=>{
          const old=before[c.dataset.w]; if(old===undefined) return;
          const d=old-c.getBoundingClientRect().top; if(!d) return;
          c.style.transition='none'; c.style.transform=`translateY(${d}px)`;
          requestAnimationFrame(()=>requestAnimationFrame(()=>{ c.style.transition='transform .28s cubic-bezier(.2,.8,.3,1)'; c.style.transform=''; }));
        });
      }, reduce?60:520);
    };
  });
}

/* ---------- 最后一步: all of this lesson's ✗ words together — 掌握 / 遗忘 ---------- */
function startFinal(){ G.view='final'; G.judge=G.judge||{}; renderLearning(); window.scrollTo(0,0); }
function finalRow(w){
  const j=G.judge[w];
  return `<div class="w fj${j?' is-'+j:''}" data-w="${esc(w)}"><button class="say fsay" aria-label="朗读 ${esc(w)}，双击看释义"><span>${esc(w)}</span><span class="fm"${G.fshow&&G.fshow.has(w)?'':' hidden'}>${esc((cur.defs||{})[w]||'暂无释义')}</span></button>
    <button class="jb ok" aria-pressed="${j==='ok'}">掌握</button><button class="jb ng" aria-pressed="${j==='ng'}">遗忘</button></div>`;
}
function finalTally(){
  const v=Object.values(G.judge), ok=v.filter(x=>x==='ok').length, ng=v.length-ok;
  return `已判断 <b>${v.length}</b><span class="cap"> / ${G.words.length}</span> · 掌握 ${ok} · 遗忘 ${ng}`;
}
function renderFinal(){
  const all=Object.keys(G.judge).length===G.words.length;
  app.innerHTML=`
  <div class="study-head">
    <header class="top"><button class="back" id="fnBack">‹ 返回学习</button><h2>${G.kind==='rev'?'复习后检测':'最后检查'}</h2><span class="sub" style="min-width:56px;text-align:right">共 ${G.words.length} 词</span></header>
    <div class="prog"><i style="width:${Object.keys(G.judge).length/G.words.length*100}%"></i></div>
  </div>
  <p class="intro">${G.kind==='rev'?'今天复习时遗忘的单词都在这里，逐个判断是否记住。记住的进入下一个词盒，又忘记的回到生词库。':'本节课的单词全部在这里，逐个判断是否记住。遗忘的词会回到生词库，下次选词时排在最前面。'}点单词听发音，双击看释义。</p>
  <div class="words" id="fwords">${G.words.map(finalRow).join('')}</div>
  <div class="bottom"><span class="tally">${finalTally()}</span><button class="btn primary" id="fnDone" ${all?'':'disabled'}>${G.kind==='rev'?'完成复习':'完成本节课'}</button></div>`;
  document.getElementById('fnBack').onclick=()=>{ G.view='list'; renderLearning(); };
  document.getElementById('fnDone').onclick=finishLearning;
  FX.popIn(app.querySelectorAll('#fwords .w'));
  document.getElementById('fwords').onclick=e=>{
    const row=e.target.closest('.w'); if(!row) return; const w=row.dataset.w;
    speak(w, row.querySelector('.say'));
    const b=e.target.closest('.jb');
    if(!b){ // double tap on the word box toggles 词性 + 释义
      const now=Date.now(); G.fshow=G.fshow||new Set(); G.ftap=G.ftap||{};
      if(G.ftap.w===w && now-G.ftap.t<380){
        G.fshow.has(w)?G.fshow.delete(w):G.fshow.add(w);
        row.querySelector('.fm').hidden=!G.fshow.has(w); G.ftap={};
      } else G.ftap={w,t:now};
      return;
    }
    const want=b.classList.contains('ok')?'ok':'ng';
    if(G.judge[w]===want) delete G.judge[w]; else G.judge[w]=want;
    const j=G.judge[w];
    row.className='w fj'+(j?' is-'+j:'');
    row.querySelector('.jb.ok').setAttribute('aria-pressed',j==='ok');
    row.querySelector('.jb.ng').setAttribute('aria-pressed',j==='ng');
    const n=Object.keys(G.judge).length;
    app.querySelector('.prog i').style.width=(n/G.words.length*100)+'%';
    app.querySelector('.tally').innerHTML=finalTally();
    document.getElementById('fnDone').disabled = n<G.words.length;
    FX.jelly(b); j==='ok'?FX.good(b,{voiceOk:false}):(j==='ng'?FX.soft(b):FX.tap());
    if(n===G.words.length && j) toast(G.kind==='rev'?'全部判断完了，点「完成复习」':'全部判断完了，点「完成本节课」');
  };
}
function finishLearning(){
  if(G.kind==='rev') return finishReview();
  const p=P(cur), lg=L(cur), t=today(), words=G.words;
  const ng=words.filter(w=>G.judge && G.judge[w]==='ng'), okw=words.filter(w=>!ng.includes(w));
  okw.forEach(w=>{ p[w]={b:1, due:t+INTERVAL[1], t}; lg.learn.push(w); });
  afAdd(cur, okw);
  ng.forEach(w=>{ delete p[w]; });
  forgot[cur.id]=[...ng, ...FG(cur).filter(w=>!words.includes(w))];
  pend[cur.id]=PD(cur).filter(w=>!words.includes(w));
  save(); G=null;
  const more=freshList(cur).length;
  app.innerHTML=`<header class="top"><button class="back" id="fBack">‹ 词库</button><h2>本节课完成</h2><span style="width:40px"></span></header>
    <div class="done"><div class="celebrate-row">${mascotSVG()}</div>${STARS}
    <h3>本节课学习完成！</h3><p>掌握 ${okw.length} 个，已放入「初出茅庐」，明天先复习它们。${ng.length?`<br>遗忘 ${ng.length} 个，已放回生词库，下次选词时排在最前面。`:''}</p>
    ${ng.length?`<div class="label">遗忘的单词（点一下听发音）</div><div class="today-list">${ng.map(w=>`<button data-w="${esc(w)}">${esc(w)}</button>`).join('')}</div>`:''}
    ${more?'<button class="btn" id="again">再选一批新词</button>':''}<button class="btn primary" id="fLib">回到词库</button></div>`;
  FX.levelClear({big:true, voiceText:'Excellent! You did it'});
  document.getElementById('fBack').onclick=document.getElementById('fLib').onclick=()=>openLib(cur);
  const a=document.getElementById('again'); if(a) a.onclick=()=>startStudy('learn');
  app.querySelectorAll('.today-list button').forEach(b=>b.onclick=()=>speak(b.dataset.w,b));
}

function finishReview(){
  const p=P(cur), words=G.words;
  const ng=words.filter(w=>G.judge && G.judge[w]==='ng'), okw=words.filter(w=>!ng.includes(w));
  okw.forEach(w=>promote(cur,w));                       // relearned → one box right, like the remembered ones
  ng.forEach(w=>{ delete p[w]; });                      // forgot again after relearning → back to 生词库
  forgot[cur.id]=[...ng, ...FG(cur).filter(w=>!words.includes(w))];
  rpend[cur.id]=RPD(cur).filter(w=>!words.includes(w));
  save(); G=null;
  app.innerHTML=`<header class="top"><button class="back" id="fBack">‹ 词库</button><h2>复习完成</h2><span style="width:40px"></span></header>
    <div class="done"><div class="celebrate-row">${mascotSVG()}</div>${STARS}
    <h3>今天的复习完成！</h3><p>重新学会 ${okw.length} 个，已和记得的单词一起进入下一个词盒。${ng.length?`<br>又忘记的 ${ng.length} 个回到生词库，之后重新学新。`:''}</p>
    ${ng.length?`<div class="label">回到生词库的单词（点一下听发音）</div><div class="today-list">${ng.map(w=>`<button data-w="${esc(w)}">${esc(w)}</button>`).join('')}</div>`:''}
    ${freshList(cur).length?'<button class="btn primary" id="goNew">开始学习新词</button>':''}<button class="btn" id="fLib">回到词库</button></div>`;
  FX.levelClear({big:true, voiceText:'Great job'});
  document.getElementById('fBack').onclick=document.getElementById('fLib').onclick=()=>openLib(cur);
  const gn=document.getElementById('goNew'); if(gn) gn.onclick=()=>{ dueList(cur).length ? openLib(cur) : startStudy('learn'); };
  app.querySelectorAll('.today-list button').forEach(b=>b.onclick=()=>speak(b.dataset.w,b));
}

/* ---------- 抗遗忘复习: 21-day curve for newly learned words ---------- */
// Review on the day of learning, then 1, 2, 4, 7, 14 and 20 days later (7 reviews inside 21 days).
const AF_OFF=[0,1,2,4,7,14,20];
const AF = lib => af[lib.id] || (af[lib.id]={plan:{}, shift:0, lastDone:null});
const AFLOG = lib => aflog[lib.id] || (aflog[lib.id]={});
// The curve runs on its own clock. Missed days pile up for at most 3 days;
// after that the clock pauses, so every word's remaining schedule is pushed back together.
function afDay(lib){
  const a=AF(lib), t=today();
  if(a.lastDone==null) a.lastDone=t;
  if(t-a.lastDone>3){ a.shift+=t-a.lastDone-3; a.lastDone=t-3; }
  return t-a.shift;
}
function afDue(lib){
  const a=AF(lib), E=afDay(lib);
  return Object.keys(a.plan).filter(w=>a.plan[w].next<=E && lib.words.includes(w)).sort((x,y)=>a.plan[x].next-a.plan[y].next || a.plan[x].base-a.plan[y].base);
}
function afAdd(lib, words){
  if(!words.length) return;
  const a=AF(lib);
  if(!afDue(lib).length) a.lastDone=today();   // nothing waiting: start the clock fresh
  const E=afDay(lib);
  words.forEach(w=>{ a.plan[w]={base:E, k:0, next:E}; });
}

let AFS=null;   // live session — never saved until it is finished
function startAF(){
  const list=afDue(cur); if(!list.length) return;
  S=null; G=null; AFS={list, res:{}};
  renderAF(); window.scrollTo(0,0);
}
function afRow(w){
  const r=AFS.res[w], def=(cur.defs||{})[w]||'暂无释义';
  return `<div class="afr${r?' is-'+r:''}" data-w="${esc(w)}">
    <button class="afw" aria-label="朗读 ${esc(w)}"><span class="t">${esc(w)}</span>${r?`<span class="m">${esc(def)}</span>`:''}</button>
    <button class="afb ok" aria-label="记得" ${r?'disabled':''}>${ICON_YES}</button><button class="afb ng" aria-label="忘了" ${r?'disabled':''}>${ICON_NO}</button></div>`;
}
function afTally(){
  const v=Object.values(AFS.res), ok=v.filter(x=>x==='ok').length;
  return `<b>${v.length}</b>/${AFS.list.length} · 对 ${ok} · 错 ${v.length-ok}`;
}
function renderAF(){
  const n=Object.keys(AFS.res).length, all=n===AFS.list.length;
  app.innerHTML=`
  <div class="study-head af-head">
    <header class="top"><button class="back" id="afExit">‹ 退出</button><h2>抗遗忘复习</h2><span class="sub num" id="afCount" style="min-width:56px;text-align:right">${n}/${AFS.list.length}</span></header>
    <div class="prog"><i style="width:${n/AFS.list.length*100}%"></i></div>
  </div>
  <div class="aflist" id="aflist">${AFS.list.map(afRow).join('')}</div>
  <div class="bottom"><span class="tally" id="afTally">${afTally()}</span><button class="btn primary" id="afDone" ${all?'':'disabled'}>完成</button></div>`;
  document.getElementById('afExit').onclick=()=>{
    const b=document.getElementById('afExit');
    if(n===0 || b.classList.contains('arm')){ AFS=null; openLib(cur); return; }
    b.classList.add('arm'); b.textContent='再点退出'; toast('退出后这次的进度不会保存');
    setTimeout(()=>{ if(b.isConnected){ b.classList.remove('arm'); b.textContent='‹ 退出'; } },3000);
  };
  document.getElementById('afDone').onclick=finishAF;
  document.getElementById('aflist').onclick=e=>{
    const row=e.target.closest('.afr'); if(!row) return; const w=row.dataset.w;
    const b=e.target.closest('.afb');
    if(!b){ speak(w, row.querySelector('.afw')); return; }
    if(AFS.res[w]) return;                       // no take-backs
    const ok=b.classList.contains('ok'); AFS.res[w]=ok?'ok':'ng';
    row.outerHTML=afRow(w);
    ok?FX.good(null,{praise:false}):FX.soft(null);
    const k=Object.keys(AFS.res).length;
    document.getElementById('afCount').textContent=`${k}/${AFS.list.length}`;
    app.querySelector('.prog i').style.width=(k/AFS.list.length*100)+'%';
    document.getElementById('afTally').innerHTML=afTally();
    document.getElementById('afDone').disabled = k<AFS.list.length;
    if(k===AFS.list.length) toast('全部完成，点「完成」查看结果');
  };
}
function finishAF(){
  const a=AF(cur), E=afDay(cur), t=today(), lg=AFLOG(cur);
  const words=AFS.list, ng=words.filter(w=>AFS.res[w]==='ng'), ok=words.length-ng.length;
  words.forEach(w=>{ const p=a.plan[w]; if(!p) return; p.k++;
    if(p.k>=AF_OFF.length) delete a.plan[w]; else p.next=Math.max(p.base+AF_OFF[p.k], E+1); });
  a.lastDone=t;
  const d=lg[t]||(lg[t]={n:0,ok:0}); d.n+=words.length; d.ok+=ok;
  save(); AFS=null;
  // last 7 days (real calendar days)
  const days=[...Array(7)].map((_,i)=>t-6+i), WK='日一二三四五六';
  const bars=days.map(dy=>{
    const r=lg[dy], pct=r&&r.n?Math.round(r.ok/r.n*100):null;
    const lab=dy===t?'今天':'周'+WK[new Date((dy-(settings.offset||0))*864e5).getUTCDay()];
    return `<div class="d7"><span class="pv num">${pct==null?'—':pct+'%'}</span><div class="bt"><i style="height:${pct==null?0:Math.max(pct,3)}%"></i></div><span class="dl">${lab}</span></div>`;
  }).join('');
  const rate=Math.round(ok/words.length*100);
  app.innerHTML=`<header class="top"><button class="back" id="afBack">‹ 词库</button><h2>抗遗忘复习完成</h2><span style="width:40px"></span></header>
  <div class="af-sum">
    <div><span class="v num">${words.length}</span><span class="k">复习单词</span></div>
    <div><span class="v num">${rate}%</span><span class="k">正确率</span></div>
    <div><span class="v num">${ng.length}</span><span class="k">遗忘</span></div>
  </div>
  <div class="task"><div class="label">过去 7 天正确率</div><div class="week7">${bars}</div></div>
  ${ng.length?`<div class="task"><div class="label">遗忘的单词（点一下听发音）</div><div class="forgot-list">${ng.map(w=>`<button class="fg" data-w="${esc(w)}"><b>${esc(w)}</b><span>${esc((cur.defs||{})[w]||'暂无释义')}</span></button>`).join('')}</div></div>`:'<div class="task"><p>这次没有遗忘的单词，全部记得！</p></div>'}
  <button class="btn primary" id="afLib" style="align-self:center">回到词库</button>`;
  FX.popIn(app.querySelectorAll('.af-sum>div,.task'));
  document.getElementById('afBack').onclick=document.getElementById('afLib').onclick=()=>openLib(cur);
  app.querySelectorAll('.fg').forEach(b=>b.onclick=()=>speak(b.dataset.w,b));
  if(rate>=80) FX.levelClear({voiceText: rate===100?'Perfect':'Great job'});
}

/* ---------- students (first page) ---------- */
function studentStats(st){
  const libsS=lsGet(`wh.${st.id}.libs`,[]).map(l=>l.builtin?SAMPLE_LIB():l);
  const keep={stu,libs,prog,log,pend,forgot,rpend,hist,af,aflog};
  loadStudent(st);
  let due=0, mastered=0, words=0; libs.forEach(l=>{const x=stats(l); due+=x.dueAll; mastered+=x.box[5]; words+=x.total;});
  const r={nLibs:libsS.length, due, mastered, words};
  ({stu,libs,prog,log,pend,forgot,rpend,hist,af,aflog}=keep);
  return r;
}
const STU_COLORS=['--b5','--b1','--b4','--b2','--b3'];
function studentsHome(){
  stu=null; cur=null; S=null; G=null; window.scrollTo(0,0); applySkin('candy');
  const cards=students.map((st,i)=>{
    const x=studentStats(st);
    const pill = x.due ? `<span class="pill due">待复习 ${x.due}</span>` : (x.words?'<span class="pill ok">今日已复习</span>':'<span class="pill">还没有词库</span>');
    return `<button class="stu" data-sid="${st.id}" style="--c:var(${STU_COLORS[i%5]})"><span class="av">${esc([...st.name][0]||'?')}</span>
      <span class="sinfo"><span class="n">${esc(st.name)}</span><span class="meta">${st.note?esc(st.note)+' · ':''}${x.nLibs} 个词库 · 已掌握 ${x.mastered}</span></span>${pill}</button>`;
  }).join('');
  app.innerHTML=`
  <header class="top"><div class="brand">${mascotSVG()}<div><h1>五盒背词</h1><div class="sub">先选择学员</div></div></div></header>
  ${simNote()}
  <div class="libs">${cards || `<div class="empty-libs">${mascotSVG()}还没有学员。在下面添加第一位学员。</div>`}</div>
  <details class="panel" id="addPanel" ${students.length?'':'open'}><summary>添加学员</summary>
    <div class="form">
      <input id="newName" placeholder="昵称或姓名，例如：小雨">
      <input id="newNote" placeholder="年级或备注（可不填），例如：初二">
      <div class="label">页面风格</div>${SKIN_PICK('newSkin','candy')}
      <label class="chk"><input type="checkbox" id="newSample" checked> 附带示例词库（可以先试用）</label>
      <button class="btn primary" id="addStu">添加</button>
    </div>
  </details>`;
  FX.popIn(app.querySelectorAll('.stu'));
  app.querySelectorAll('.stu').forEach(b=>b.onclick=()=>{ loadStudent(students.find(x=>x.id===b.dataset.sid)); applySkin(stu.skin); home(); window.scrollTo(0,0); });
  document.getElementById('addStu').onclick=()=>{
    const name=document.getElementById('newName').value.trim();
    if(!name){ toast('请填写昵称或姓名'); return; }
    const st={id:'s'+Date.now(), name, note:document.getElementById('newNote').value.trim(), skin:(document.querySelector('input[name=newSkin]:checked')||{}).value||'candy'};
    students.push(st); lsSet(`wh.${st.id}.libs`, document.getElementById('newSample').checked?[SAMPLE_LIB()]:[]);
    save(); studentsHome(); toast(`已添加学员：${name}`);
  };
}

studentsHome();
