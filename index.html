}
function lessonMarkRev(w, m){
  if(!lesson) return;
  lesson.rev.ok=lesson.rev.ok.filter(x=>x!==w); lesson.rev.ng=lesson.rev.ng.filter(x=>x!==w);
  if(m==='yes') lesson.rev.ok.push(w); else if(m==='no') lesson.rev.ng.push(w);
  lessonSave();
}
function lessonNoteLearn(words, ng){
  if(!lesson) return;
  words.forEach(w=>{ if(!lesson.learn.words.includes(w)) lesson.learn.words.push(w); });
  ng.forEach(w=>{ if(!lesson.learn.ng.includes(w)) lesson.learn.ng.push(w); });
  lessonSave();
}
function lessonNoteRevAgain(ng){ if(!lesson) return; ng.forEach(w=>{ if(!lesson.revAgain.includes(w)) lesson.revAgain.push(w); }); lessonSave(); }
function defOf(w){ for(const l of libs){ if(l.defs && l.defs[w]) return l.defs[w]; } return ''; }

/* floating timer chip */
let chip=null, chipMenu=null;
function ensureChip(){
  if(chip && chip.isConnected) return;
  chip=document.createElement('button'); chip.className='lesson-chip'; chip.setAttribute('aria-label','本节课计时');
  chip.onclick=openChipMenu; document.body.appendChild(chip);
}
function tickLesson(){
  if(!stu || !lesson){ if(chip) chip.hidden=true; return; }
  ensureChip(); chip.hidden=false;
  const used=Date.now()-lesson.start, left=LESSON_MS-used;
  const mm=Math.floor(Math.abs(left)/60000), ss=Math.floor(Math.abs(left)%60000/1000);
  chip.className='lesson-chip'+(left<=0?' over':(left<=WARN_MS?' warn':''));
  chip.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M10 2h4"/></svg><span class="num">${left<=0?'超时 ':''}${pad2(mm)}:${pad2(ss)}</span>`;
  if(left<=WARN_MS && left>0 && !lesson.w5){ lesson.w5=true; lessonSave(); FX.alarm(); banner('还剩 5 分钟', '本节课快结束了，抓紧完成最后的单词'); }
  if(left<=0 && !lesson.w0){ lesson.w0=true; lessonSave(); FX.alarm(true); banner('1 小时到了', '点左下角计时器「下课」，生成这节课的课堂报告'); }
}
setInterval(tickLesson, 1000);
function banner(title, text){
  document.querySelectorAll('.lesson-banner').forEach(b=>b.remove());
  const b=document.createElement('div'); b.className='lesson-banner'; b.innerHTML=`<b>${title}</b><span>${text}</span>`;
  b.onclick=()=>b.remove(); document.body.appendChild(b); setTimeout(()=>b.remove(),7000);
}
function openChipMenu(){
  if(chipMenu){ chipMenu.remove(); chipMenu=null; return; }
  const used=Math.floor((Date.now()-lesson.start)/60000);
  const nRev=lesson.rev.ok.length+lesson.rev.ng.length, nLearn=lesson.learn.words.length;
  chipMenu=document.createElement('div'); chipMenu.className='chip-menu';
  chipMenu.innerHTML=`<div class="cm-h">本节课 · ${hhmm(lesson.start)} 开始，已用 ${used} 分钟</div>
    <div class="cm-s">已复习 ${nRev} 个 · 已学新 ${nLearn} 个</div>
    <button class="btn primary" id="cmEnd">下课并生成课堂报告</button>
    <button class="btn sm" id="cmDrop">取消本次计时</button>`;
  document.body.appendChild(chipMenu);
  chipMenu.querySelector('#cmEnd').onclick=()=>{ chipMenu.remove(); chipMenu=null;
    if(!nRev && !nLearn){ toast('这节课还没有复习或学新的单词'); return; }
    S=null; G=null; AFS=null; endLesson(); };
  const dp=chipMenu.querySelector('#cmDrop');
  dp.onclick=()=>{ if(!dp.classList.contains('arm')){ dp.classList.add('arm'); dp.textContent='再点一次确认（不生成报告）'; return; }
    lesson=null; lessonSave(); chipMenu.remove(); chipMenu=null; tickLesson(); toast('已取消本次计时'); };
}

/* end of lesson → snapshot → report */
function endLesson(nav=true){
  if(!lesson) return null;
  const used=(lesson.libs&&lesson.libs.length)?lesson.libs:[{id:lesson.lib,name:lesson.libName}];
  const end=Math.min(Date.now(), lesson.start+LESSON_MS*1.5);
  const all=[...lesson.rev.ok, ...lesson.rev.ng, ...lesson.learn.words], defs={};
  all.forEach(w=>defs[w]=defOf(w));
  const libStats=used.map(u=>{ const L=libs.find(x=>x.id===u.id); if(!L) return null; const st=stats(L);
    return {name:L.name, total:st.total, boxes:[st.fresh, st.box[1], st.box[2], st.box[3], st.box[4], st.box[5]]}; }).filter(Boolean);
  const rep={id:'r'+Date.now(), start:lesson.start, end, name:stu.name, note:stu.note||'', libName:used.map(u=>u.name).join('、'),
    libStats, lib:libStats[0]||null,
    rev:{ok:[...lesson.rev.ok], ng:[...lesson.rev.ng]}, revAgain:[...lesson.revAgain], learn:{words:[...lesson.learn.words], ng:[...lesson.learn.ng]}, defs, comment:null};
  reports.unshift(rep); reports=reports.slice(0,30);
  lesson=null; lessonSave(); tickLesson();
  if(nav) openReport(rep.id, 'report', true); else toast('上一节课的课堂报告已生成，可在「课堂报告」里查看');
  return rep;
}
function repNumbers(r){
  const revN=r.rev.ok.length+r.rev.ng.length, revNg=r.rev.ng.length, learnN=r.learn.words.length, learnNg=r.learn.ng.length;
  const total=revNg+learnN, mins=Math.max(1,Math.round((r.end-r.start)/60000));
  return {revN, revNg, learnN, learnNg, total, mins,
    revRate: revN?Math.round(revNg/revN*100):0, learnRate: learnN?Math.round(learnNg/learnN*100):0,
    eff: (total/(mins/60)).toFixed(2)};
}
function autoComment(r){
  const n=repNumbers(r), nm=r.name;
  const parts=[];
  parts.push(`${nm}本节课共识记 ${n.total} 个单词${n.revNg&&n.learnN?`（复习遗忘 ${n.revNg} 个＋学新 ${n.learnN} 个）`:''}`);
  if(n.revN) parts.push(`复习了 ${n.revN} 个单词，${n.revNg?`遗忘 ${n.revNg} 个，已重新学习`:'全部记得，非常扎实'}`);
  if(n.learnN) parts.push(n.learnNg?`学新 ${n.learnN} 个，学后检测还有 ${n.learnNg} 个需要下节课再巩固`:`学新 ${n.learnN} 个，学后检测全部掌握`);
  const cheer = n.learnNg===0 && n.revRate<=20 ? '学习状态越来越好了，继续保持！' : (n.total>=30 ? '学习量很充足，坚持就是胜利！' : '每天进步一点点，加油！');
  return parts.join('；')+'。'+cheer;
}

/* save the visible report / sheet as a picture (share sheet on phones, otherwise long-press to save) */
function loadH2C(){
  return window.html2canvas ? Promise.resolve() : new Promise((ok,no)=>{ const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'; s.onload=ok; s.onerror=no; document.head.appendChild(s); });
}
async function saveImage(name){
  const el=document.getElementById('capture'); if(!el) return;
  toast('正在生成图片…');
  try{
    await loadH2C();
    const canvas=await window.html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true});
    const url=canvas.toDataURL('image/png');
    try{
      const blob=await (await fetch(url)).blob(), file=new File([blob],name,{type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); return; }
    }catch(e){ if(e && e.name==='AbortError') return; }
    showImage(url);
  }catch(e){ toast('图片生成失败，可以直接截屏保存'); }
}
function showImage(url){
  const o=document.createElement('div'); o.className='img-overlay';
  o.innerHTML=`<p>长按图片 →「存储到照片」或「保存图片」</p><img src="${url}" alt="报告图片"><button class="btn">关闭</button>`;
  o.querySelector('button').onclick=()=>o.remove(); document.body.appendChild(o);
}

/* ---------- 备课: snapshot everything, restore on exit ---------- */
const PREP_KEY='wh.__prep';
function prepOn(){ try{ return !!localStorage.getItem(PREP_KEY); }catch(e){ return false; } }
function whKeys(){ const ks=[]; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.startsWith('wh.') && k!==PREP_KEY) ks.push(k); } }catch(e){} return ks; }
function startPrep(){
  save(); lessonSave();
  const snap={}; whKeys().forEach(k=>snap[k]=localStorage.getItem(k));
  try{ localStorage.setItem(PREP_KEY, JSON.stringify(snap)); }catch(e){ toast('这台设备无法开启备课模式'); return; }
  prepUI(); settingsPage(); toast('已进入备课：随便操作，退出备课后全部还原');
}
function endPrep(){
  let snap=null; try{ snap=JSON.parse(localStorage.getItem(PREP_KEY)||'null'); }catch(e){}
  if(!snap) return;
  const sid=stu&&stu.id, libId=cur&&cur.id;
  whKeys().forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
  Object.entries(snap).forEach(([k,v])=>{ try{ localStorage.setItem(k,v); }catch(e){} });
  try{ localStorage.removeItem(PREP_KEY); }catch(e){}
  settings=Object.assign({rate:0.9, offset:0, sfx:true, cheer:true, voiceSrc:'human'}, lsGet('wh.settings',{}));
  students=lsGet('wh.students',[]); S=null; G=null; AFS=null; REP=null; cur=null;
  document.querySelectorAll('.praise,.combo,.lesson-banner,.chip-menu').forEach(e=>e.remove()); chipMenu=null;
  const st=students.find(x=>x.id===sid);
  if(st){ loadStudent(st); applySkin(st.skin); const l=libs.find(x=>x.id===libId); l?openLib(l):studentHub(); } else { stu=null; studentsHome(); }
  prepUI(); tickLesson(); toast('已退出备课，学员的学习进度已还原');
}
let prepPill=null;
function prepUI(){
  const onNow=prepOn();
  if(!onNow){ if(prepPill){ prepPill.remove(); prepPill=null; } return; }
  if(prepPill && prepPill.isConnected) return;
  prepPill=document.createElement('button'); prepPill.className='prep-pill'; prepPill.innerHTML='备课中 · <b>退出备课</b>';
  prepPill.onclick=()=>{ if(!prepPill.classList.contains('arm')){ prepPill.classList.add('arm'); prepPill.innerHTML='再点一次，还原所有记录'; setTimeout(()=>{ if(prepPill){ prepPill.classList.remove('arm'); prepPill.innerHTML='备课中 · <b>退出备课</b>'; } },3000); return; } endPrep(); };
  document.body.appendChild(prepPill);
}

/* 抗遗忘复习 forecast: how many words each day if the student reviews every day */
function afForecast(lib, days=7){
  const a=AF(lib), E=afDay(lib), cnt=Array(days).fill(0);
  Object.keys(a.plan).forEach(w=>{
    if(!lib.words.includes(w)) return;
    const p=a.plan[w]; let k=p.k, d=Math.max(p.next,E);
    while(k<AF_OFF.length && d-E<days){ cnt[d-E]++; k++; if(k>=AF_OFF.length) break; d=Math.max(p.base+AF_OFF[k], d+1); }
  });
  return cnt;
}
function afPlanHTML(lib){
  const cnt=afForecast(lib,7); if(!cnt.some(n=>n)) return '';
  const max=Math.max(...cnt), WK='日一二三四五六', t=today();
  const lab=i=> i===0?'今天':(i===1?'明天':'周'+WK[new Date((t+i-(settings.offset||0))*864e5).getUTCDay()]);
  return `<div class="af-plan"><div class="afp-h"><b>抗遗忘复习计划</b><span>未来 7 天共 ${cnt.reduce((a,b)=>a+b,0)} 词次</span></div>
    <div class="afp">${cnt.map((n,i)=>`<div class="afd${i===0?' today':''}"><span class="n num">${n}</span><div class="bt"><i style="height:${max?Math.max(n?8:0,n/max*100):0}%"></i></div><span class="d">${lab(i)}</span></div>`).join('')}</div>
    <p class="afp-note">按 21 天记忆曲线预计，假设每天都完成复习；不含之后新学的单词。</p></div>`;
}

/* ---------- 轮次与奖章: 3 rounds per library; bronze / silver / gold ---------- */
const RD = lib => rounds[lib.id] || (rounds[lib.id]={round:1, medals:[]});
const MEDAL=['铜','银','金'];
function medalSVG(i, on=true, size=30){
  const C=[['#F0B07A','#B8733A'],['#EEF1F5','#9AA3AF'],['#FFE27A','#D99A00']][i-1];
  return `<svg class="medal${on?'':' off'}" width="${size}" height="${Math.round(size*1.25)}" viewBox="0 0 40 50" role="img" aria-label="${MEDAL[i-1]}牌"><path d="M11 0h8l-3 19h-8z" fill="#E8495F"/><path d="M29 0h-8l3 19h8z" fill="#3D7BE0"/><circle cx="20" cy="32" r="15.5" fill="${C[1]}"/><circle cx="20" cy="32" r="12.5" fill="${C[0]}"/><path d="M20 24.5l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5-3.6-3.5 5-.7z" fill="${C[1]}"/></svg>`;
}
function roundHTML(lib, s){
  const R=RD(lib), done=s.total>0 && s.box[5]===s.total, p=P(lib);
  const partN=lib.words.filter(w=>p[w] && p[w].b===5 && p[w].cat!=='pre').length;
  let h=`<div class="round-bar"><span class="rpill">第 ${R.round} 轮 <small>/ 3</small></span><span class="medals">${[1,2,3].map(i=>medalSVG(i, R.medals.includes(i))).join('')}</span></div>`;
  if(done && R.round<3) h+=`<div class="round-card"><b>第 ${R.round} 轮完成！获得${MEDAL[R.round-1]}牌</b><span>全部 ${s.total} 个单词都进入了「登峰造极」</span>
    <button class="btn primary" id="nextRound">开始第 ${R.round+1} 轮</button>
    <div class="round-pick" id="roundPick" hidden>
      <button class="rp-opt" data-mode="all"><b>全部进入</b><span>${s.total} 个单词全部回到生词库，重新学一轮</span></button>
      <button class="rp-opt" data-mode="part" ${partN?'':'disabled'}><b>部分进入</b><span>只放回曾经不认识、经过学习和复习才掌握的 ${partN} 个单词</span></button>
    </div></div>`;
  else if(done) h+=`<div class="round-card gold"><b>三轮全部完成！</b><span>铜、银、金三枚奖章已全部获得</span></div>`;
  return h;
}
function bindRound(lib, s){
  const R=RD(lib), done=s.total>0 && s.box[5]===s.total;
  if(done && !R.medals.includes(R.round)){ R.medals.push(R.round); save(); setTimeout(()=>medalPop(R.round), 450); }
  const nr=document.getElementById('nextRound');
  if(nr) nr.onclick=()=>{ document.getElementById('roundPick').hidden=false; nr.hidden=true; };
  app.querySelectorAll('.rp-opt').forEach(b=>b.onclick=()=>{
    if(!b.classList.contains('arm')){ app.querySelectorAll('.rp-opt').forEach(x=>x.classList.remove('arm')); b.classList.add('arm'); b.querySelector('b').textContent+='（再点一次确认）'; return; }
    startRound(lib, b.dataset.mode);
  });
}
function startRound(lib, mode){
  const p=P(lib), hi=HI(lib), R=RD(lib);
  const ws=lib.words.filter(w=>p[w] && (mode==='all' || p[w].cat!=='pre'));
  ws.forEach(w=>{ delete p[w]; delete hi[w]; });
  pend[lib.id]=[]; rpend[lib.id]=[]; forgot[lib.id]=[];
  R.round++; save(); openLib(lib);
  toast(`第 ${R.round} 轮开始：${ws.length} 个单词回到了生词库`);
}
function medalPop(i){
  const o=document.createElement('div'); o.className='medal-pop';
  o.innerHTML=`<div class="mp-card">${medalSVG(i,true,120)}<h3>获得${MEDAL[i-1]}牌！</h3><p>第 ${i} 轮学习完成，${i<3?'继续加油冲击下一枚奖章':'三枚奖章全部收入囊中'}</p><button class="btn primary">收下奖章</button></div>`;
  o.querySelector('button').onclick=()=>o.remove(); document.body.appendChild(o);
  FX.levelClear({big:true, voiceText:'Congratulations'});
}

/* ---------- students (first page) ---------- */
function studentStats(st){
  const libsS=lsGet(`wh.${st.id}.libs`,[]);
  const keep={stu,libs,prog,log,pend,forgot,rpend,hist,af,aflog,lesson,reports,rounds};
  loadStudent(st);
  let due=0, mastered=0, words=0; libs.forEach(l=>{const x=stats(l); due+=x.dueAll; mastered+=x.box[5]; words+=x.total;});
  const r={nLibs:libsS.length, due, mastered, words};
  ({stu,libs,prog,log,pend,forgot,rpend,hist,af,aflog,lesson,reports,rounds}=keep);
  return r;
}
const STU_COLORS=['--b5','--b1','--b4','--b2','--b3'];
function studentsHome(){
  stu=null; cur=null; S=null; G=null; window.scrollTo(0,0); applySkin('candy'); tickLesson(); if(chipMenu){chipMenu.remove();chipMenu=null;}
  const cards=students.map((st,i)=>{
    const x=studentStats(st);
    const pill = x.due ? `<span class="pill due">待复习 ${x.due}</span>` : (x.words?'<span class="pill ok">今日已复习</span>':'<span class="pill">还没有词库</span>');
    return `<button class="stu" data-sid="${st.id}" style="--c:var(${STU_COLORS[i%5]})"><span class="av">${esc([...st.name][0]||'?')}</span>
      <span class="sinfo"><span class="n">${esc(st.name)}</span><span class="meta">${st.note?esc(st.note)+' · ':''}${x.nLibs} 个词库 · 已掌握 ${x.mastered}</span></span>${pill}</button>`;
  }).join('');
  app.innerHTML=`
  <header class="top"><div class="brand">${mascotSVG()}<div><h1>五盒背词</h1><div class="sub">先选择学员</div></div></div></header>
  ${simNote()}
  <div class="libs">${cards || `<div class="empty-libs">${mascotSVG()}还没有学员。在下面添加第一位学员。</div>`}</div>
  <details class="panel" id="addPanel" ${students.length?'':'open'}><summary>添加学员</summary>
    <div class="form">
      <input id="newName" placeholder="昵称或姓名，例如：小雨">
      <input id="newNote" placeholder="年级或备注（可不填），例如：初二">
      <div class="label">页面风格</div>${SKIN_PICK('newSkin','candy')}
      <div class="label">开通词库（可多选，之后也能在学员信息里修改）</div>
      <div class="cat-pick">${CATALOG.map(id=>`<label class="chk"><input type="checkbox" name="newCat" value="${id}"> ${esc(catName(id))}</label>`).join('')}</div>
      <button class="btn primary" id="addStu">添加</button>
    </div>
  </details>`;
  FX.popIn(app.querySelectorAll('.stu'));
  app.querySelectorAll('.stu').forEach(b=>b.onclick=()=>{ loadStudent(students.find(x=>x.id===b.dataset.sid)); ensurePresets(stu); applySkin(stu.skin); tickLesson(); studentHub(); window.scrollTo(0,0); });
  document.getElementById('addStu').onclick=()=>{
    const name=document.getElementById('newName').value.trim();
    if(!name){ toast('请填写昵称或姓名'); return; }
    const st={id:'s'+Date.now(), name, note:document.getElementById('newNote').value.trim(), skin:(document.querySelector('input[name=newSkin]:checked')||{}).value||'candy'};
    students.push(st); lsSet(`wh.${st.id}.libs`, [...document.querySelectorAll('input[name=newCat]:checked')].map(i=>i.value==='sample'?{id:'sample',builtin:true}:{id:i.value,preset:i.value}));
    save(); studentsHome(); toast(`已添加学员：${name}`);
  };
}

studentsHome();
prepUI();
</script>
